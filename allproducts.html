    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

  <body class="catalog-page">
    <header class="catalog-header">
      <a href="index.html" class="catalog-back">← Back to Home</a>
      <div class="sec-tag">The Full Collection</div>
      <h1 class="sec-title">All <span>Products</span></h1>
      <p>
        Thoughtful letters, keepsakes, and gifts made for meaningful moments.
      </p>
      <div class="catalog-search">
        <label for="productSearch">Find a product</label>
        <div class="catalog-search-box">
          <span aria-hidden="true">⌕</span>
          <input
            id="productSearch"
            type="search"
            placeholder="Try “birthday”, “romantic”, “photos”, or “gift”"
            autocomplete="off"
          />
        </div>
        <p class="catalog-search-hint" id="searchStatus" aria-live="polite">
          Showing all products
        </p>
      </div>
    </header>

    <main class="catalog-grid" id="catalogGrid"></main>
  </body>

      ],
      [

        "₦15,000",
        ["vintage-memory-book 2.jpeg", "vintage-memory-book.jpeg"],
        "A personalized collection of photographs, mementos, stories, and memorabilia that documents a specific life event, relationship, or personal history — bound into a keepsake you'll cherish forever.",
      ],
      [
        "Chocolate Box",
        "₦4,000 per box",
        ["choco 1.jpeg", "choco 2.jpeg"],
        "A beautifully curated chocolate gift box, dressed up with intention and care. Perfect for anniversaries, celebrations, or just because — sweet on the outside, sweeter on the inside.",
      ],
      [
        "Memory Frame",
        "₦5,000",
        ["memory-book.jpeg"],
        "A framed keepsake that holds a memory, a date, and a feeling — made to hang on a wall and stay on a heart. Beautiful, simple, and forever.",
      ],
      [
        "Birthday Letter Book",
        "₦10,000",
        ["birthday 1.jpeg"],
        "A birthday keepsake combining a handwritten letter with a photo memory prompt. Share your message and then send the picture to Lade via DM after booking.",
      ],
      [
        "Handwritten Letter Frame",
        "₦12,000",
        ["handwrittenframe2.jpeg", "hand2.jpeg", "handwritten frame.jpeg"],
        "A handwritten letter frame is a beautiful way to preserve heartfelt words and meaningful memories. Elegantly displayed, it transforms a personal letter into a timeless keepsake that can be treasured and admired for years to come.",
      ],
      [
        "Music Scan & Vintage Letter",
        "₦12,000",
        ["music 1.jpeg", "music 2.jpeg", "music 3.jpeg"],
        "Some songs say the words our hearts cannot. A music scan paired with a vintage letter creates a timeless keepsake—one that lets someone read your heart and hear the soundtrack behind it. Every note, every lyric, and every handwritten word becomes a memory they can hold onto long after the music fades.",

      ],

        [
          "card 1.jpeg",

        ],

      ],
      [

        "₦4,000",
        [
          "card 1.jpeg",

        ],

      ],
    ];

    const productKeywords = {
      "Single Letter":
        "gift romantic love apology anniversary personal message",
      "Letter Polaroid": "gift romantic love photo memory anniversary keepsake",
      "Polaroid Pocket": "gift photo picture memory small keepsake",
      "Scroll Letter": "gift romantic dramatic long letter keepsake",
      "Love Jar": "gift romantic love self love notes manifestation decor",
      "Vintage Memory Book":
        "gift photos memories family relationship anniversary keepsake",
      "Chocolate Box": "gift birthday anniversary celebration sweet chocolate",
      "Memory Frame": "gift photo memory date wall keepsake anniversary",
      "Birthday Letter Book": "birthday gift photos keepsake celebration",
      "Handwritten Letter Frame":
        "gift handwritten romantic love photo frame keepsake",
      "Music Scan & Vintage Letter":
        "gift romantic music song lyrics handwritten letter",
      "Write a Letter Yourself": "DIY gift handwritten personal message letter",
      "The Puzzle Game": "game gift romantic questions memories relationship",
      "LÁDÉ Card Letters — Custom Made":
        "gift birthday thank you appreciation custom handwritten card",
      "LÁDÉ Card Letters — Blank Card":
        "gift birthday thank you DIY blank card write message",
    };

    const grid = document.getElementById("catalogGrid");
    const searchInput = document.getElementById("productSearch");
    const searchStatus = document.getElementById("searchStatus");

    function renderProducts(searchTerm = "") {
      const query = searchTerm.trim().toLowerCase();
      const matchingProducts = products.filter(
        ([name, price, , description]) => {
          const searchableText =
            `${name} ${price} ${description} ${productKeywords[name] || ""}`.toLowerCase();
          return (
            !query ||
            query.split(/\s+/).every((word) => searchableText.includes(word))
          );
        },
      );
      grid.innerHTML = "";
      searchStatus.textContent = query
        ? `${matchingProducts.length} product${matchingProducts.length === 1 ? "" : "s"} found`
        : "Showing all products";

      matchingProducts.forEach(
        ([name, price, images, description], productIndex) => {
          const galleryId = "catalog-gallery-" + productIndex;
          const encodedName = encodeURIComponent(name);
          const article = document.createElement("article");
          article.className = "catalog-card";
          article.innerHTML = `
        <div class="catalog-gallery" id="${galleryId}">
          ${images.map((image, index) => `<img class="catalog-slide ${index === 0 ? "active" : ""}" src="${image}" alt="${name} ${index + 1}">`).join("")}
          ${images.length > 1 ? `<button class="catalog-prev" aria-label="Previous image">‹</button><button class="catalog-next" aria-label="Next image">›</button><div class="catalog-dots">${images.map((_, index) => `<button class="catalog-dot ${index === 0 ? "active" : ""}" aria-label="Show image ${index + 1}"></button>`).join("")}</div><span class="catalog-count">1 / ${images.length}</span>` : ""}
        </div>
        <div class="catalog-card-body"><h2>${name}</h2><strong>${price}</strong><p>${description.replaceAll("\n\n", "<br><br>")}</p><a href="book.html?offering=${encodedName}">Book This</a></div>`;
          grid.appendChild(article);
          const slides = [...article.querySelectorAll(".catalog-slide")];
          if (slides.length > 1) {
            let current = 0;
            const count = article.querySelector(".catalog-count");
            const dots = [...article.querySelectorAll(".catalog-dot")];
            const show = (next) => {
              current = (next + slides.length) % slides.length;
              slides.forEach((slide, index) =>
                slide.classList.toggle("active", index === current),
              );
              dots.forEach((dot, index) =>
                dot.classList.toggle("active", index === current),
              );
              count.textContent = `${current + 1} / ${slides.length}`;
            };
            article.querySelector(".catalog-prev").onclick = () =>
              show(current - 1);
            article.querySelector(".catalog-next").onclick = () =>
              show(current + 1);
            dots.forEach((dot, index) => (dot.onclick = () => show(index)));
          }
        },
      );

      if (!matchingProducts.length) {
        grid.innerHTML = `<div class="catalog-empty"><strong>No matching products</strong><span>Try “letter”, “photo”, “birthday”, “card”, or “gift”.</span></div>`;
      }
    }

    searchInput.addEventListener("input", (event) =>
      renderProducts(event.target.value),
    );
    renderProducts();
  </script>
</html>
